# Optional: a local PostgreSQL for development. Credentials here are for local use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vglug
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: vglug
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
